<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新语故事详情 · 元乡·江西</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#16324c;--blue:#2f80ed;--sky:#6cc4f2;--yellow:#f5b301;
  --ink:#20304a;--muted:#5b7286;
  --glass:rgba(255,255,255,.62);--stroke:rgba(255,255,255,.75);
  --shadow:0 20px 40px -18px rgba(21,52,90,.28);
  --font-display:"Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink);line-height:1.85;min-height:100vh;overflow-x:hidden;
  background:linear-gradient(160deg,#eaf4fb 0%,#f7fbff 45%,#eef3fa 100%);
}
/* 背景光斑 */
.blobs{position:fixed;inset:0;z-index:-1;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.b1{width:520px;height:520px;background:radial-gradient(circle,#9ec9f6,transparent 65%);top:-140px;left:-120px;animation:drift 22s ease-in-out infinite alternate}
.b2{width:460px;height:460px;background:radial-gradient(circle,#ffe6a6,transparent 65%);bottom:-160px;right:-120px;animation:drift 26s ease-in-out infinite alternate-reverse}
.b3{width:340px;height:340px;background:radial-gradient(circle,#c9b6f0,transparent 65%);top:38%;left:60%;animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(60px,40px) scale(1.08)}}

/* 顶栏 */
.topbar{
  position:sticky;top:14px;z-index:60;width:min(1160px,94%);margin:14px auto 0;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 24px;border-radius:50px;
  background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
  box-shadow:0 14px 30px -14px rgba(21,52,90,.25);
}
.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--font-display);font-weight:700;font-size:1.18rem;color:var(--navy)}
.brand svg{width:22px;height:22px}
.crumb{font-size:.82rem;color:var(--muted);letter-spacing:2px}
@media(max-width:640px){.crumb{display:none}}

/* Hero */
.hero-route{position:relative;min-height:58vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;margin-top:-72px;padding-top:72px}
.hero-route .hero-bg{position:absolute;inset:0;z-index:0}
.hero-route .hero-bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);animation:slowzoom 18s ease-in-out infinite alternate}
@keyframes slowzoom{to{transform:scale(1.14)}}
.hero-route .hero-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(9,25,44,.5) 0%,rgba(9,25,44,.62) 55%,#f4f9fd 100%);
}
.hero-inner{position:relative;z-index:2;padding:110px 24px 90px;max-width:860px}
.no-badge{
  display:inline-block;padding:7px 20px;border-radius:30px;margin-bottom:16px;
  font-size:.85rem;font-weight:700;letter-spacing:3px;color:#20315a;
  background:var(--yellow);box-shadow:0 10px 24px -8px rgba(245,179,1,.7);
}
.hero-inner h1{
  font-family:var(--font-display);font-size:clamp(1.9rem,4.6vw,3rem);
  color:#fff;letter-spacing:3px;text-shadow:0 4px 26px rgba(6,24,42,.55);line-height:1.4;
}
.hero-inner .theme-en{display:block;margin-top:10px;font-size:.85rem;letter-spacing:4px;color:rgba(255,255,255,.85)}
.hero-actions{display:flex;justify-content:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.abtn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 26px;border-radius:30px;
  font-size:.9rem;font-weight:700;text-decoration:none;letter-spacing:1px;transition:.3s;
}
.abtn svg{width:16px;height:16px}
.abtn.ghost{color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.abtn.ghost:hover{background:rgba(255,255,255,.26);transform:translateY(-3px)}

/* 正文板块 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.schip{
  padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:600;
  color:#8a6a10;background:rgba(255,201,77,.3);border:1px solid rgba(245,179,1,.45);
}
.xsec{max-width:920px;margin:64px auto 0}
.xhead{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.xicon{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;
  font-family:var(--font-display);font-weight:800;font-size:1.15rem;color:#fff;
  background:linear-gradient(135deg,#3f92f2,#6cc4f6);
  box-shadow:0 12px 24px -10px rgba(47,128,237,.55);
}
.xhead h3{font-family:var(--font-display);font-size:1.5rem;color:var(--navy);letter-spacing:2px}
.xcard{
  background:var(--glass);border:1px solid var(--stroke);border-radius:18px;
  padding:24px 28px;margin-bottom:16px;backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);box-shadow:0 16px 32px -18px rgba(21,52,90,.3);
  transition:transform .35s ease,box-shadow .35s ease;
}
.xcard:hover{transform:translateY(-4px);box-shadow:0 26px 46px -18px rgba(21,52,90,.4)}
.xcard p{color:var(--muted);font-size:.96rem}

/* AIGC 科技风互动卡 */
.aigc-card{
  position:relative;overflow:hidden;border-radius:22px;padding:30px 34px;
  color:#dce9f7;
  background:linear-gradient(135deg,#0a1a33 0%,#122a52 55%,#1d1140 100%);
  border:1px solid rgba(108,196,242,.35);
  box-shadow:0 24px 50px -20px rgba(10,26,51,.55);
  transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease;
}
.aigc-card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(108,196,242,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(108,196,242,.07) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(80% 100% at 80% 0%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(80% 100% at 80% 0%,#000 30%,transparent 75%);
}
.aigc-card:hover{transform:translateY(-5px);border-color:rgba(108,196,242,.7);box-shadow:0 30px 60px -18px rgba(23,80,160,.6)}
.aigc-tag{
  display:inline-flex;align-items:center;gap:8px;padding:5px 16px;border-radius:30px;
  font-size:.75rem;font-weight:700;letter-spacing:2px;margin-bottom:14px;
  color:#9ecbff;background:rgba(108,196,242,.14);border:1px solid rgba(108,196,242,.4);
}
.aigc-tag::before{content:"✦"}
.aigc-card h4{font-family:var(--font-display);font-size:1.3rem;color:#fff;letter-spacing:1px;margin-bottom:8px;position:relative}
.aigc-card p{color:rgba(220,233,247,.8);font-size:.93rem;position:relative}
.aigc-chip{
  display:inline-block;padding:4px 14px;border-radius:20px;margin:10px 8px 0 0;
  font-size:.78rem;font-weight:600;color:#9ecbff;
  background:rgba(108,196,242,.12);border:1px solid rgba(108,196,242,.35);
}
.aigc-btn{
  position:relative;display:inline-flex;align-items:center;gap:8px;margin-top:18px;
  padding:11px 26px;border-radius:30px;border:none;cursor:pointer;
  font-size:.88rem;font-weight:700;font-family:inherit;letter-spacing:1px;
  color:#20315a;background:var(--yellow);box-shadow:0 12px 26px -10px rgba(245,179,1,.75);transition:.3s;
}
.aigc-btn svg{width:16px;height:16px}
.aigc-btn:hover{transform:translateY(-3px);box-shadow:0 18px 34px -10px rgba(245,179,1,.9)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

/* 其他文章 */
.others{max-width:820px;margin:44px auto 90px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.ocard{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:20px 24px;border-radius:18px;text-decoration:none;
  background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 16px 30px -18px rgba(21,52,90,.3);
  transition:transform .35s ease,box-shadow .35s ease;
}
.ocard:hover{transform:translateY(-5px);box-shadow:0 26px 46px -18px rgba(21,52,90,.42)}
.ocard .oname{font-family:var(--font-display);font-weight:700;font-size:1.05rem;color:var(--navy)}
.ocard .otheme{display:block;font-size:.8rem;color:var(--muted);letter-spacing:1px;margin-top:2px}
.ocard .oarr{
  flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--blue);background:rgba(47,128,237,.1);transition:.3s;
}
.ocard:hover .oarr{background:var(--yellow);color:#20315a;transform:rotate(-45deg)}
.ocard .oarr svg{width:18px;height:18px}
@media(max-width:680px){.others{grid-template-columns:1fr}}

/* 页脚 */
footer{padding:30px 0 34px;text-align:center;color:var(--muted);font-size:.82rem;letter-spacing:1px;border-top:1px solid rgba(21,52,90,.08)}

/* 图片骨架微光 */
img.gen{opacity:0;filter:blur(8px);transform:scale(1.03);transition:opacity .9s ease,filter .9s ease,transform .9s ease;background:linear-gradient(100deg,#dfe9f2 30%,#f2f7fb 50%,#dfe9f2 70%);background-size:200% 100%;animation:shimmer 1.6s linear infinite}
img.gen.loaded{opacity:1;filter:blur(0);transform:scale(1)}
@keyframes shimmer{to{background-position:-200% 0}}
img.gen.failed{opacity:.35;animation:none;filter:none}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:34px;z-index:90;transform:translateX(-50%) translateY(16px);
  padding:12px 26px;border-radius:30px;font-size:.88rem;letter-spacing:1px;
  color:#20315a;background:rgba(255,255,255,.9);border:1px solid rgba(245,179,1,.55);
  box-shadow:0 18px 36px -12px rgba(21,52,90,.4);opacity:0;pointer-events:none;transition:.35s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

      text: '上传一张三湾的山水照片或一盅老鸭汤的特写，AI 生成一段气味散文诗，把“柴火香”“雨后泥土气”“酱香回甘”转译成文字，作为这趟慢游的数字纪念。',
      chips: ['柴火香', '雨后泥土气', '酱香回甘'] }
  }
};
const ORDER = ['nanchang', 'ruijin', 'yongxin'];

/* ============ 渲染 ============ */
const key = new URLSearchParams(location.search).get('id');
const a = ARTICLES[key] || ARTICLES.nanchang;

document.title = a.title + ' · 新语故事 — 元乡·江西';
document.getElementById('crumb').textContent = '新语故事 · ' + a.tag;
const hero = document.getElementById('heroImg');
hero.alt = a.title;
hero.dataset.prompt = a.prompt;
hero.dataset.size = 'landscape_16_9';
document.getElementById('dateBadge').textContent = a.date;
document.getElementById('aTitle').textContent = a.title;
document.getElementById('aTag').textContent = a.tag;

let html = '';
a.sections.forEach(s => {
  html += `<div class="xsec">
    <div class="xhead"><span class="xicon">${s.icon}</span><h3>${s.title}</h3></div>
    <div class="xcard rv"><div class="chips">${s.chips.map(c => `<span class="schip">${c}</span>`).join('')}</div><p>${s.text}</p></div>
  </div>`;
});
html += `<div class="xsec">
  <div class="xhead"><span class="xicon" style="font-size:.8rem;letter-spacing:1px">AI</span><h3>AIGC 互动点</h3></div>
  <div class="aigc-card rv">
    <span class="aigc-tag">AIGC · DIGITAL MEMORY</span>
    <h4>${a.aigc.title}</h4>
    <p>${a.aigc.text}</p>
    <div>${a.aigc.chips.map(c => `<span class="aigc-chip">${c}</span>`).join('')}</div>
    <button class="aigc-btn" onclick="toast('${a.aigc.toastMsg}')">${a.aigc.btn}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div></div>`;
document.getElementById('bodyWrap').insertAdjacentHTML('afterbegin', html);

/* 其他文章 */
document.getElementById('others').innerHTML = ORDER.filter(k => k !== key).map(k => {
  const o = ARTICLES[k];
  return `<a class="ocard" href="文章详情.html?id=${k}">
    <span><span class="oname">${o.tag}</span><span class="otheme">${o.title}</span></span>
    <span class="oarr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </a>`;
}).join('');

/* ============ AI 生图加载 ============ */
function imgUrl(prompt, size) {
  return 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=' + encodeURIComponent(prompt) + '&image_size=' + (size || 'landscape_16_9');
}
const isPh = img => img.naturalWidth === 1832 && img.naturalHeight === 1832;
let genSeq = 0;
function setupImg(img) {
  if (!img || !img.dataset.prompt) return;
  let tries = 0, timer = null;
  const attempt = bust => {
    img.classList.remove('loaded', 'failed');
    img.src = imgUrl(img.dataset.prompt, img.dataset.size) + (bust ? '&r=' + (++genSeq) : '');
  };
  img.addEventListener('load', () => {
    if (isPh(img)) {
      if (tries < 5) { tries++; timer = setTimeout(() => attempt(true), 3000 * tries); }
      else img.classList.add('failed');
    } else {
      clearTimeout(timer);
      img.classList.add('loaded');
    }
  });
  img.addEventListener('error', () => {
    if (tries < 3) { tries++; timer = setTimeout(() => attempt(tries > 1), 1500 * tries); }
    else img.classList.add('failed');
  });
  setTimeout(() => attempt(false), Math.min((++genSeq) * 320, 4000));
}
document.querySelectorAll('img.gen').forEach(setupImg);

/* ============ 滚动显现 ============ */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: .12 });
document.querySelectorAll('.rv').forEach(el => io.observe(el));

/* ============ Toast ============ */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
</script>
