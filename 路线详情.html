<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寻迹路线详情 · 元乡·江西</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#16324c;--blue:#2f80ed;--sky:#6cc4f2;--yellow:#f5b301;
  --ink:#20304a;--muted:#5b7286;
  --glass:rgba(255,255,255,.62);--stroke:rgba(255,255,255,.75);
  --shadow:0 20px 40px -18px rgba(21,52,90,.28);
  --font-display:"Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink);line-height:1.85;min-height:100vh;overflow-x:hidden;
  background:linear-gradient(160deg,#eaf4fb 0%,#f7fbff 45%,#eef3fa 100%);
}
/* 背景光斑 */
.blobs{position:fixed;inset:0;z-index:-1;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.b1{width:520px;height:520px;background:radial-gradient(circle,#9ec9f6,transparent 65%);top:-140px;left:-120px;animation:drift 22s ease-in-out infinite alternate}
.b2{width:460px;height:460px;background:radial-gradient(circle,#ffe6a6,transparent 65%);bottom:-160px;right:-120px;animation:drift 26s ease-in-out infinite alternate-reverse}
.b3{width:340px;height:340px;background:radial-gradient(circle,#c9b6f0,transparent 65%);top:38%;left:60%;animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(60px,40px) scale(1.08)}}

/* 顶栏 */
.topbar{
  position:sticky;top:14px;z-index:60;width:min(1160px,94%);margin:14px auto 0;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 24px;border-radius:50px;
  background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
  box-shadow:0 14px 30px -14px rgba(21,52,90,.25);
}
.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--font-display);font-weight:700;font-size:1.18rem;color:var(--navy)}
.brand svg{width:22px;height:22px}
.crumb{font-size:.82rem;color:var(--muted);letter-spacing:2px}
@media(max-width:640px){.crumb{display:none}}

/* 路线 Hero */
.hero-route{position:relative;min-height:58vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;margin-top:-72px;padding-top:72px}
.hero-route .hero-bg{position:absolute;inset:0;z-index:0}
.hero-route .hero-bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);animation:slowzoom 18s ease-in-out infinite alternate}
@keyframes slowzoom{to{transform:scale(1.14)}}
.hero-route .hero-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(9,25,44,.5) 0%,rgba(9,25,44,.62) 55%,#f4f9fd 100%);
}
.hero-inner{position:relative;z-index:2;padding:110px 24px 90px;max-width:860px}
.no-badge{
  display:inline-block;padding:7px 20px;border-radius:30px;margin-bottom:18px;
  font-size:.85rem;font-weight:700;letter-spacing:3px;color:#20315a;
  background:var(--yellow);box-shadow:0 10px 24px -8px rgba(245,179,1,.7);
}
.hero-inner h1{
  font-family:var(--font-display);font-size:clamp(2.2rem,5.4vw,3.6rem);
  color:#fff;letter-spacing:4px;text-shadow:0 4px 26px rgba(6,24,42,.55);line-height:1.3;
}
.hero-inner .theme-en{display:block;margin-top:8px;font-size:.85rem;letter-spacing:6px;color:rgba(255,255,255,.82);font-family:Georgia,serif}
.hero-inner .intro{
  margin:26px auto 0;max-width:620px;padding:16px 26px;border-radius:18px;
  color:#fff;font-size:1.02rem;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  text-shadow:0 1px 8px rgba(6,24,42,.4);
}

/* 通用容器 */
.container{width:min(1160px,92%);margin:0 auto}
.sec-head{text-align:center;margin:76px 0 54px}
.sec-head .eyebrow{
  display:inline-flex;align-items:center;gap:10px;font-size:.8rem;letter-spacing:4px;
  color:var(--blue);font-weight:700;text-transform:uppercase;
}
.sec-head .eyebrow::before,.sec-head .eyebrow::after{content:"";width:36px;height:1px;background:linear-gradient(90deg,transparent,var(--sky))}
.sec-head .eyebrow::after{background:linear-gradient(90deg,var(--sky),transparent)}
.sec-head h2{font-family:var(--font-display);font-size:clamp(1.7rem,3.4vw,2.4rem);color:var(--navy);letter-spacing:3px;margin-top:10px}

/* 行程时间轴 */
.timeline{position:relative;max-width:820px;margin:0 auto;padding-bottom:10px}
.tl-item{position:relative;padding:0 0 36px 92px;opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.tl-item.in{opacity:1;transform:none}
.tl-item::before{content:"";position:absolute;left:27px;top:64px;bottom:2px;width:2px;background:linear-gradient(180deg,#8dbef0,rgba(141,190,240,.1))}
.tl-item:last-child::before{display:none}
.tl-dot{
  position:absolute;left:0;top:0;width:56px;height:56px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--font-display);font-weight:800;
  font-size:1.05rem;color:#fff;background:linear-gradient(135deg,#3f92f2,#6cc4f6);
  box-shadow:0 14px 26px -10px rgba(47,128,237,.6);
}
.tl-card{
  background:var(--glass);border:1px solid var(--stroke);border-radius:20px;
  padding:24px 28px;backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  box-shadow:var(--shadow);transition:transform .35s ease,box-shadow .35s ease;
}
.tl-card:hover{transform:translateY(-5px);box-shadow:0 28px 50px -20px rgba(21,52,90,.4)}
.tl-card h3{font-family:var(--font-display);font-size:1.3rem;color:var(--navy);letter-spacing:1px;margin-bottom:8px}
.tl-card h3 small{font-family:Georgia,serif;font-size:.72rem;color:var(--sky);letter-spacing:2px;margin-left:10px;font-weight:400}
.tl-card p{color:var(--muted);font-size:.96rem}
.tl-tip{
  display:inline-flex;align-items:flex-start;gap:8px;margin-top:14px;
  padding:7px 16px;border-radius:30px;font-size:.82rem;line-height:1.6;
  color:#8a6a10;background:rgba(255,201,77,.28);border:1px solid rgba(245,179,1,.45);
}
.tl-tip::before{content:"✦";flex:none;line-height:1.6}
/* 可点击站点卡（跳转站点攻略） */
a.tl-card{display:block;text-decoration:none;cursor:pointer}
a.tl-card:hover{transform:translateY(-6px);border-color:rgba(245,179,1,.55);box-shadow:0 30px 54px -20px rgba(21,52,90,.45)}
.tl-more{
  display:inline-flex;align-items:center;gap:6px;margin-top:14px;margin-left:10px;
  padding:6px 14px;border-radius:30px;font-size:.8rem;font-weight:700;
  color:#20315a;background:var(--yellow);box-shadow:0 8px 18px -8px rgba(245,179,1,.7);
  opacity:0;transform:translateX(-8px);transition:opacity .3s ease,transform .3s ease;
}
.tl-more svg{width:14px;height:14px}
a.tl-card:hover .tl-more{opacity:1;transform:none}
@media(max-width:680px){.tl-more{opacity:1;transform:none}}
/* 可点击地标卡（跳转地标攻略） */
a.xcard{display:block;text-decoration:none;cursor:pointer}
a.xcard:hover{border-color:rgba(245,179,1,.55);box-shadow:0 26px 46px -18px rgba(21,52,90,.42)}
.xmore{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  padding:6px 14px;border-radius:30px;font-size:.8rem;font-weight:700;
  color:#20315a;background:var(--yellow);box-shadow:0 8px 18px -8px rgba(245,179,1,.7);
  opacity:0;transform:translateX(-8px);transition:opacity .3s ease,transform .3s ease;
}
.xmore svg{width:14px;height:14px}
a.xcard:hover .xmore{opacity:1;transform:none}
@media(max-width:680px){.xmore{opacity:1;transform:none}}

/* 扩展板块：核心地标 / 美食街区 / 漫步节奏 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.schip{
  padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:600;
  color:#8a6a10;background:rgba(255,201,77,.3);border:1px solid rgba(245,179,1,.45);
}
.xsec{max-width:920px;margin:64px auto 0}
.xhead{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.xicon{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;
  font-family:var(--font-display);font-weight:800;font-size:1.15rem;color:#fff;
  background:linear-gradient(135deg,#3f92f2,#6cc4f6);
  box-shadow:0 12px 24px -10px rgba(47,128,237,.55);
}
.xhead h3{font-family:var(--font-display);font-size:1.5rem;color:var(--navy);letter-spacing:2px}
.xdesc{max-width:920px;margin:-6px 0 20px;color:var(--muted);font-size:.95rem;line-height:1.8}
@media(max-width:980px){.xdesc{margin-left:0;margin-right:0}}
.xcard{
  background:var(--glass);border:1px solid var(--stroke);border-radius:18px;
  padding:20px 24px;margin-bottom:16px;backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);box-shadow:0 16px 32px -18px rgba(21,52,90,.3);
  transition:transform .35s ease,box-shadow .35s ease;
}
.xcard:hover{transform:translateY(-4px);box-shadow:0 26px 46px -18px rgba(21,52,90,.4)}
.xcard h4{font-family:var(--font-display);color:var(--navy);font-size:1.12rem;margin-bottom:4px}
.xcard h4 .xno{color:var(--blue);margin-right:8px;font-family:Georgia,serif}
.xcard p{color:var(--muted);font-size:.93rem}
.rhythm{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.rcard{
  background:var(--glass);border:1px solid var(--stroke);border-radius:18px;
  padding:20px 22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 16px 32px -18px rgba(21,52,90,.3);transition:transform .35s ease;
}
.rcard:hover{transform:translateY(-4px)}
.rcard h4{font-family:var(--font-display);color:var(--navy);font-size:1.08rem;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed rgba(47,128,237,.3)}
.rcard ol{list-style:none;counter-reset:step}
.rcard li{
  counter-increment:step;position:relative;padding:5px 0 5px 30px;
  color:var(--muted);font-size:.9rem;line-height:1.7;
}
.rcard li::before{
  content:counter(step,decimal-leading-zero);position:absolute;left:0;top:7px;
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:.62rem;font-weight:800;color:#fff;background:linear-gradient(135deg,#3f92f2,#6cc4f6);
}
@media(max-width:820px){.rhythm{grid-template-columns:1fr}}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

/* 其他路线 */
.others{max-width:820px;margin:44px auto 90px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.ocard{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:20px 24px;border-radius:18px;text-decoration:none;
  background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 16px 30px -18px rgba(21,52,90,.3);
  transition:transform .35s ease,box-shadow .35s ease;
}
.ocard:hover{transform:translateY(-5px);box-shadow:0 26px 46px -18px rgba(21,52,90,.42)}
.ocard .oname{font-family:var(--font-display);font-weight:700;font-size:1.08rem;color:var(--navy)}
.ocard .otheme{display:block;font-size:.8rem;color:var(--muted);letter-spacing:1px;margin-top:2px}
.ocard .oarr{
  flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--blue);background:rgba(47,128,237,.1);transition:.3s;
}
.ocard:hover .oarr{background:var(--yellow);color:#20315a;transform:rotate(-45deg)}
.ocard .oarr svg{width:18px;height:18px}
@media(max-width:680px){.others{grid-template-columns:1fr}.tl-item{padding-left:78px}}

/* 页脚 */
footer{padding:30px 0 34px;text-align:center;color:var(--muted);font-size:.82rem;letter-spacing:1px;border-top:1px solid rgba(21,52,90,.08)}

/* 图片骨架微光 */
img.gen{opacity:0;filter:blur(8px);transform:scale(1.03);transition:opacity .9s ease,filter .9s ease,transform .9s ease;background:linear-gradient(100deg,#dfe9f2 30%,#f2f7fb 50%,#dfe9f2 70%);background-size:200% 100%;animation:shimmer 1.6s linear infinite}
img.gen.loaded{opacity:1;filter:blur(0);transform:scale(1)}
@keyframes shimmer{to{background-position:-200% 0}}
img.gen.failed{opacity:.35;animation:none;filter:none}
</style>
</head>
<body>

<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<header class="topbar">
  <a class="brand" href="马尔代夫旅游网站.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2f80ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
    元乡<em>·江西</em>
  </a>
  <span class="crumb" id="crumb">寻迹路线 · 路线详情</span>
</header>

<section class="hero-route">
  <div class="hero-bg"><img class="gen" id="heroImg" alt="路线风景"></div>
  <div class="hero-inner">
    <span class="no-badge" id="noBadge"></span>

<main class="container">

    <h2>其他寻迹路线</h2>
  </div>
  <div class="others" id="others"></div>
</main>

<footer>© 2026 元乡·江西 — 保留所有权利</footer>

/* ============ 路线数据 ============ */
const ROUTES = {

const ORDER = ['nanchang', 'ruijin', 'yongxin'];

/* ============ 渲染 ============ */
const key = new URLSearchParams(location.search).get('stop');
const r = ROUTES[key] || ROUTES.nanchang;

document.title = r.title + ' · 寻迹路线 — 元乡·江西';
document.getElementById('crumb').textContent = '寻迹路线 · ' + r.no + ' ' + r.theme;
const hero = document.getElementById('heroImg');
hero.alt = r.title;
hero.dataset.prompt = r.prompt;
hero.dataset.size = 'landscape_16_9';
document.getElementById('noBadge').textContent = r.no + ' · ' + r.theme;
document.getElementById('rTitle').textContent = r.title;
document.getElementById('themeEn').textContent = r.en;
document.getElementById('rIntro').textContent = r.intro;

document.getElementById('timeline').innerHTML = r.stops.map((s, i) => `
  <div class="tl-item" style="transition-delay:${i * 0.08}s">
    <div class="tl-dot">${String(i + 1).padStart(2, '0')}</div>
    ${s.href ? `<a class="tl-card" href="${s.href}" title="查看「${s.name}」完整攻略">` : '<div class="tl-card">'}
      <h3>${s.name}<small>${s.en}</small></h3>
      <p>${s.desc}</p>
      <span class="tl-tip">${s.tip}</span>
      ${s.href ? `<span class="tl-more">查看完整攻略<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>` : ''}
    ${s.href ? '</a>' : '</div>'}
  </div>`).join('');

document.getElementById('others').innerHTML = ORDER.filter(k => k !== key).map(k => {
  const o = ROUTES[k];
  return `<a class="ocard" href="路线详情.html?stop=${k}">
    <span><span class="oname">${o.no}：${o.title}</span><span class="otheme">${o.theme} · ${o.stops.length} 个打卡点</span></span>

  </a>`;
}).join('');

/* ============ AI 生图加载 ============ */
function imgUrl(prompt, size) {
  return 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=' + encodeURIComponent(prompt) + '&image_size=' + (size || 'landscape_16_9');
}
/* 占位图检测：生成排队时返回固定占位图（1832x1832），需换参重试 */
const isPh = img => img.naturalWidth === 1832 && img.naturalHeight === 1832;
let genSeq = 0;
function setupImg(img) {
  if (!img || !img.dataset.prompt) return;
  let tries = 0, timer = null;
  const attempt = bust => {
    img.classList.remove('loaded', 'failed');
    img.src = imgUrl(img.dataset.prompt, img.dataset.size) + (bust ? '&r=' + (++genSeq) : '');
  };
  img.addEventListener('load', () => {
    if (isPh(img)) {
      if (tries < 5) { tries++; timer = setTimeout(() => attempt(true), 3000 * tries); }
      else img.classList.add('failed');
    } else {
      clearTimeout(timer);
      img.classList.add('loaded');
    }
  });
  img.addEventListener('error', () => {
    if (tries < 3) { tries++; timer = setTimeout(() => attempt(tries > 1), 1500 * tries); }
    else img.classList.add('failed');
  });
  setTimeout(() => attempt(false), Math.min((++genSeq) * 320, 4000));  // 错峰请求
}
document.querySelectorAll('img.gen').forEach(setupImg);

/* ============ 滚动显现 ============ */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: .12 });
document.querySelectorAll('.tl-item').forEach(el => io.observe(el));

/* ============ 扩展板块：核心地标 / 美食街区 / 漫步节奏 ============ */
const ex = r.extra;
if (ex) {
  const xhead = x => `<div class="xhead"><span class="xicon">${x.icon}</span><h3>${x.title}</h3></div>${x.desc ? `<p class="xdesc">${x.desc}</p>` : ''}`;
  let html = '';
  html += `<div class="xsec">${xhead(ex.landmarks)}${ex.landmarks.items.map(i => `
    ${i.href ? `<a class="xcard rv" href="${i.href}" title="查看「${i.t}」地标攻略">` : '<div class="xcard rv">'}
      <h4><span class="xno">${i.n}</span>${i.t}</h4>
      <div class="chips">${i.chips.map(c => `<span class="schip">${c}</span>`).join('')}</div>
      <p>${i.d}</p>
      ${i.href ? `<span class="xmore">查看地标攻略<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>` : ''}
    ${i.href ? '</a>' : '</div>'}`).join('')}</div>`;
  html += `<div class="xsec">${xhead(ex.food)}${ex.food.items.map(i => `
    ${i.href ? `<a class="xcard rv" href="${i.href}" title="查看「${i.t}」美食攻略">` : '<div class="xcard rv">'}
      <h4>${i.t}</h4>
      <div class="chips">${i.chips.map(c => `<span class="schip">${c}</span>`).join('')}</div>
      <p>${i.d}</p>
      ${i.href ? `<span class="xmore">查看美食攻略<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>` : ''}
    ${i.href ? '</a>' : '</div>'}`).join('')}</div>`;
  html += `<div class="xsec">${xhead(ex.rhythm)}<div class="rhythm">${ex.rhythm.items.map(i => `
    <div class="rcard rv">
      <h4>${i.t}</h4>
      <ol>${i.steps.map(s => `<li>${s}</li>`).join('')}</ol>
    </div>`).join('')}</div></div>`;
  document.getElementById('extraWrap').innerHTML = html;
  document.querySelectorAll('.rv').forEach(el => io.observe(el));
}
</script>
